[project]
name = "ff-analyst"
version = "0.1.0"
description = "Local fantasy football trade and league analysis for one Sleeper league"
requires-python = ">=3.12"
dependencies = [
    "nicegui[native]",
    "duckdb",
    "polars",
    "pyarrow",
    "httpx",
    "nflreadpy",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
